name: college-library

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://library:library@postgres:5432/library
      REDIS_URL: redis://redis:6379
      LIBRARY_DATA_DIR: /app/library-data
      RAW_DATA_DIR: /app/raw-data
      MCP_INCLUDE_PENDING: "true"
      # Cloudflare terminates public TLS; keep the localhost origin HTTP.
      HTTPS_CERT_FILE: ""
      HTTPS_KEY_FILE: ""
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      # Ingestion writes originals here; OCR output is written to processed.
      - ../local-ingest/data/processed:/app/library-data
      - ../local-ingest/data/raw:/app/raw-data
      - ./certs:/app/certs:ro

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../infra/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ../infra/migrations/002_library_search.sql:/docker-entrypoint-initdb.d/002_library_search.sql:ro
      - ../infra/migrations/003_subject_short_name.sql:/docker-entrypoint-initdb.d/003_subject_short_name.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres-data:
    external: true
    name: oracle_postgres-data
